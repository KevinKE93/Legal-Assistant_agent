name: Legal-Assistant_agent
display_name: 法律助手智能体 Legal-Assistant_agent
version: 1.1.0
language: zh-CN/en
purpose: 法律助手智能体，支持法律分析、纠纷维权、证据整理、矛盾分析、官方来源检索、法官视角和策略行动。
privacy: 默认脱敏，不保存或复用个人隐私。
not_legal_advice: true
entrypoint: SKILL.md
install:
  script: scripts/install.sh
  default_target: "${CODEX_HOME:-$HOME/.codex}/skills/legal-assistant-agent"
  supported_clients:
    - codex
    - claude-code
    - cursor
    - gemini-cli
    - opencode
    - openclaw
validation:
  command: python3 scripts/validate_skill.py
outputs:
  writer: scripts/write_analysis_output.py
research:
  script: scripts/legal_research.py
  source_registry: references/official_source_registry.json
  priority: official_sources_first
  providers:
    - official
    - brave
    - tavily
    - serpapi
    - bing
    - duckduckgo
  official_adapters:
    - legislation_gov_uk_atom
    - find_case_law_atom
method_wheel:
  - 范围约束
  - 事实还原
  - 争点拆解
  - 证据映射
  - 矛盾测试
  - 因果推论
  - 对方视角
  - 法官视角
  - 策略行动
  - 复盘迭代
skills:
  - id: privacy_scope_guard
    path: skills/01_privacy_scope_guard/SKILL.md
    trigger: 任何法律分析前、涉及隐私或高风险行为时
  - id: case_intake_issue_map
    path: skills/02_case_intake_issue_map/SKILL.md
    trigger: 初次描述案件、事实混乱、需要争点地图
  - id: timeline_evidence_ledger
    path: skills/03_timeline_evidence_ledger/SKILL.md
    trigger: 需要整理时间线、证据清单、证明对象
  - id: elements_burden_matrix
    path: skills/04_elements_burden_matrix/SKILL.md
    trigger: 需要判断请求成立条件、证明责任、证据缺口
  - id: contradiction_analysis
    path: skills/05_contradiction_analysis/SKILL.md
    trigger: 需要找矛盾、漏洞、质证点
  - id: causation_chain
    path: skills/06_causation_chain/SKILL.md
    trigger: 需要证明行为与损害之间的因果关系
  - id: admission_question_design
    path: skills/07_admission_question_design/SKILL.md
    trigger: 需要设计合法提问、锁定事实或形成承认
  - id: opponent_perspective
    path: skills/08_opponent_perspective/SKILL.md
    trigger: 需要模拟对方抗辩、证据攻击和反制
  - id: judge_perspective
    path: skills/09_judge_perspective/SKILL.md
    trigger: 需要从法官/仲裁员/调解员视角评估案件
  - id: case_reference_research
    path: skills/10_case_reference_research/SKILL.md
    trigger: 需要案例检索、规则学习、类案对比
  - id: strategy_risk_action
    path: skills/11_strategy_risk_action/SKILL.md
    trigger: 需要制定谈判、投诉、诉讼或答辩行动方案
  - id: document_drafting
    path: skills/12_document_drafting/SKILL.md
    trigger: 需要起草函件、投诉、起诉状、答辩状或证据目录
  - id: hearing_prep
    path: skills/13_hearing_prep/SKILL.md
    trigger: 需要准备调解、仲裁、庭审、质证和发问
  - id: review_learning_loop
    path: skills/14_review_learning_loop/SKILL.md
    trigger: 新证据、新进展、新陈述后需要复盘更新
forbidden:
  - 编造法条、案例、案号、证据
  - 伪造、篡改、隐藏、销毁证据
  - 指导虚假陈述
  - 非法取证
  - 威胁、骚扰、公开隐私
  - 承诺胜诉
